services:
  db:
    container_name: sql_server_local
    build:
      context: .
      dockerfile: db.Dockerfile
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SuperPassword123!"

  api:
    container_name: python_api_local
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    environment:
      - DB_SERVER=db
      - DB_NAME=db_cotizaciones
      - DB_USER=admin
      - DB_PASSWORD=SuperPassword123!
      - MSSQL_SA_PASSWORD=SuperPassword123!
    depends_on:
      - db