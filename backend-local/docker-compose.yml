version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server_local
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperPassword123!
    ports:
      - "1433:1433"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./api
    container_name: python_api_local
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_SERVER=db
      - DB_USER=sa
      - DB_PASSWORD=SuperPassword123!
      - DB_NAME=db_cotizaciones
    volumes:
      - ./api:/app